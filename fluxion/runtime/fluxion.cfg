// Fluxion autoconfig must begin with a comment for Firefox's loader.
(() => {
  let rootPath = Services.env.get("FLUXION_ROOT");
  if (!rootPath) {
    const greDirectory = Services.dirsvc.get("GreD", Ci.nsIFile);
    const bundledRoot = greDirectory.clone();
    bundledRoot.append("fluxion");
    if (bundledRoot.exists() && bundledRoot.isDirectory()) {
      rootPath = bundledRoot.path;
    }
  }
  if (!rootPath) {
    Cu.reportError("Fluxion: FLUXION_ROOT was not provided by the launcher");
    return;
  }

  const root = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  root.initWithPath(rootPath);

  const newTab = root.clone();
  newTab.append("newtab");
  newTab.append("index.html");
  let newTabURL = "about:newtab";
  const about = root.clone();
  about.append("about");
  about.append("index.html");
  if (about.exists()) {
    Services.prefs.setStringPref("fluxion.about.url", Services.io.newFileURI(about).spec);
  }
  Services.prefs.setBoolPref("app.update.auto", false);
  Services.prefs.setBoolPref("app.update.background.enabled", false);
  Services.prefs.setBoolPref("browser.shell.checkDefaultBrowser", false);
  // Mozilla's pre-onboarding flow contains Firefox-specific terms, branding,
  // telemetry choices, and experiments. It is not Fluxion onboarding and must
  // never cover the product chrome on a new profile. Disabling the feature is
  // Gecko's own automation-supported hard opt-out; it does not record consent.
  Services.prefs.setBoolPref("browser.preonboarding.enabled", false);
  Services.prefs.setBoolPref("browser.aboutwelcome.experimentsGate.enabled", false);
  if (newTab.exists()) {
    newTabURL = Services.io.newFileURI(newTab).spec;
    Services.prefs.setStringPref("fluxion.newtab.url", newTabURL);
    Services.prefs.setStringPref("browser.startup.homepage", newTabURL);
    Services.prefs.setIntPref("browser.startup.page", 1);
    Services.prefs.setBoolPref("browser.sessionstore.resume_from_crash", true);
    Services.prefs.setBoolPref("browser.aboutwelcome.enabled", false);
    Services.prefs.setBoolPref("datareporting.policy.dataSubmissionEnabled", false);
    Services.prefs.setBoolPref("datareporting.healthreport.uploadEnabled", false);
    Services.prefs.setBoolPref("toolkit.telemetry.enabled", false);
    Services.prefs.setBoolPref("app.shield.optoutstudies.enabled", false);
    Services.prefs.setBoolPref("browser.newtabpage.activity-stream.showSponsored", false);
    Services.prefs.setBoolPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
    const memoryEnabled = Services.prefs.getBoolPref("fluxion.memory.enabled", false);
    Services.prefs.setBoolPref("browser.ml.enable", memoryEnabled);
    Services.prefs.setBoolPref("places.semanticHistory.featureGate", memoryEnabled);
    Services.prefs.setStringPref("browser.toolbars.bookmarks.visibility", "never");
  }

  function load(window, relativePath) {
    const file = root.clone();
    for (const segment of relativePath.split("/")) {
      file.append(segment);
    }
    if (!file.exists() || !file.isFile()) {
      throw new Error(`Fluxion chrome file is missing: ${relativePath}`);
    }
    Services.scriptloader.loadSubScript(
      Services.io.newFileURI(file).spec,
      window,
      "UTF-8"
    );
  }

  const observer = {
    observe(window, topic) {
      if (
        topic !== "browser-delayed-startup-finished" ||
        !window ||
        !window.document ||
        window.document.documentURI !== "chrome://browser/content/browser.xhtml" ||
        window.__fluxionLoaded
      ) {
        return;
      }

      window.__fluxionLoaded = true;
      try {
        load(window, "chrome/core/url.js");
        load(window, "chrome/core/workspaces.js");
        load(window, "chrome/core/tab-groups.js");
        load(window, "chrome/core/split-views.js");
        load(window, "chrome/core/memory-policy.js");
        load(window, "chrome/core/memory-ranking.js");
        load(window, "chrome/core/settings.js");
        load(window, "chrome/core/tab-sleeping.js");
        load(window, "chrome/core/search.js");
        load(window, "chrome/fluxion-chrome.js");
        load(window, "chrome/fluxion-memory.js");
        load(window, "chrome/fluxion-tab-sleeping.js");
        try {
          load(window, "chrome/fluxion-settings.js");
          Services.prefs.clearUserPref("fluxion.settings.error");
        } catch (settingsError) {
          Services.prefs.setStringPref("fluxion.settings.error", String(settingsError));
          Services.prefs.savePrefFile(null);
          Cu.reportError(settingsError);
        }
        load(window, "chrome/fluxion-palette.js");
        if (newTabURL !== "about:newtab") {
          const { AboutNewTab } = ChromeUtils.importESModule(
            "resource:///modules/AboutNewTab.sys.mjs"
          );
          AboutNewTab.newTabURL = newTabURL;
          const selected = window.gBrowser && window.gBrowser.selectedBrowser;
          if (
            selected &&
            (selected.currentURI.spec === "about:newtab" ||
              selected.currentURI.spec === "about:home" ||
              selected.currentURI.spec === "about:blank")
          ) {
            selected.loadURI(newTabURL, {
              triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
            });
          }
        }
      } catch (error) {
        window.__fluxionLoaded = false;
        Cu.reportError(error);
      }
    },
  };

  Services.obs.addObserver(observer, "browser-delayed-startup-finished");
})();
