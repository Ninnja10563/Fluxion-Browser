// Fluxion autoconfig must begin with a comment for Firefox's loader.
(() => {
  let rootPath = Services.env.get("FLUXION_ROOT");
  if (!rootPath) {
    const greDirectory = Services.dirsvc.get("GreD", Ci.nsIFile);
    const bundledRoot = greDirectory.clone();
    bundledRoot.append("fluxion");
    if (bundledRoot.exists() && bundledRoot.isDirectory()) {
      rootPath = bundledRoot.path;
    }
  }
  if (!rootPath) {
    Cu.reportError("Fluxion: FLUXION_ROOT was not provided by the launcher");
    return;
  }

  const root = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  root.initWithPath(rootPath);

  const rootFileURI = Services.io.newFileURI(root).spec;
  const resourceRoot = Services.io.newURI(`${rootFileURI.replace(/\/$/, "")}/`);
  const resourceHandler = Services.io.getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  resourceHandler.setSubstitution("fluxion", resourceRoot);
  // Register the one bundled defaults resource before Places starts its native
  // fresh-profile import. Never force an import or edit an existing profile.
  try {
    const defaultsManifest = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
    defaultsManifest.append("fluxion-defaults");
    defaultsManifest.append("chrome.manifest");
    if (!defaultsManifest.exists()) throw new Error("Fluxion default-bookmark manifest is missing");
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(defaultsManifest);
    Services.prefs.clearUserPref("fluxion.defaults.error");
  } catch (error) {
    Services.prefs.setStringPref("fluxion.defaults.error", String(error));
    Cu.reportError(error);
  }
  try {
    ChromeUtils.registerWindowActor("FluxionMemoryPage", {
      parent: { esModuleURI: "resource://fluxion/actors/FluxionMemoryPageParent.sys.mjs" },
      child: { esModuleURI: "resource://fluxion/actors/FluxionMemoryPageChild.sys.mjs" },
      matches: ["http://*/*", "https://*/*"],
      messageManagerGroups: ["browsers"],
      safeForUntrustedWebProcess: true,
    });
  } catch (error) {
    if (!String(error).includes("already registered")) Cu.reportError(error);
  }

  const browsingFixtureOrigin = Services.env.get("FLUXION_BROWSING_ORIGIN");
  if (Services.env.get("FLUXION_VISUAL_BROWSING_TEST") === "1" &&
      /^http:\/\/127\.0\.0\.1:\d+$/.test(browsingFixtureOrigin)) {
    ChromeUtils.registerWindowActor("FluxionBrowsingVerification", {
      parent: { esModuleURI: "resource://fluxion/actors/FluxionBrowsingVerificationParent.sys.mjs" },
      child: { esModuleURI: "resource://fluxion/actors/FluxionBrowsingVerificationChild.sys.mjs" },
      // Gecko match patterns compare hosts without ports. Each fixed actor
      // command additionally checks the full fixture origin including its port.
      matches: ["http://127.0.0.1/*"],
      messageManagerGroups: ["browsers"],
      safeForUntrustedWebProcess: true,
    });
  }

  const newTab = root.clone();
  const transferFixtureOrigin = Services.env.get("FLUXION_TAB_TRANSFER_ORIGIN");
  if (Services.env.get("FLUXION_TAB_TRANSFER_TEST") === "1" &&
      /^http:\/\/127\.0\.0\.1:\d+$/.test(transferFixtureOrigin)) {
    ChromeUtils.registerWindowActor("FluxionTabTransferVerification", {
      parent: { esModuleURI: "resource://fluxion/actors/FluxionTabTransferVerificationParent.sys.mjs" },
      child: { esModuleURI: "resource://fluxion/actors/FluxionTabTransferVerificationChild.sys.mjs" },
      matches: ["http://127.0.0.1/*"], messageManagerGroups: ["browsers"], safeForUntrustedWebProcess: true,
    });
  }
  const pickerFixtureOrigin = Services.env.get("FLUXION_FILE_PICKER_ORIGIN");
  if (Services.env.get("FLUXION_FILE_PICKER_TEST") === "1" &&
      /^http:\/\/127\.0\.0\.1:\d+$/.test(pickerFixtureOrigin)) {
    ChromeUtils.registerWindowActor("FluxionFilePickerVerification", {
      parent: { esModuleURI: "resource://fluxion/actors/FluxionFilePickerVerificationParent.sys.mjs" },
      child: { esModuleURI: "resource://fluxion/actors/FluxionFilePickerVerificationChild.sys.mjs" },
      matches: ["http://127.0.0.1/*"], messageManagerGroups: ["browsers"], safeForUntrustedWebProcess: true,
    });
  }
  newTab.append("newtab");
  newTab.append("index.html");
  let newTabURL = "about:newtab";
  Services.prefs.setStringPref("fluxion.about.url", "about:preferences?fluxion=about");
  Services.prefs.setStringPref("fluxion.about.route.health", "settings-about-route-ready");
  Services.prefs.setBoolPref("app.update.auto", false);
  Services.prefs.setBoolPref("app.update.background.enabled", false);
  Services.prefs.setBoolPref("browser.shell.checkDefaultBrowser", false);
  // Mozilla's pre-onboarding flow contains Firefox-specific terms, branding,
  // telemetry choices, and experiments. It is not Fluxion onboarding and must
  // never cover the product chrome on a new profile. Disabling the feature is
  // Gecko's own automation-supported hard opt-out; it does not record consent.
  Services.prefs.setBoolPref("browser.preonboarding.enabled", false);
  Services.prefs.setBoolPref("browser.aboutwelcome.experimentsGate.enabled", false);
  if (newTab.exists()) {
    newTabURL = Services.io.newFileURI(newTab).spec;
    const previousNewTabURL = Services.prefs.getStringPref("fluxion.newtab.url", "");
    const homepage = Services.prefs.getStringPref("browser.startup.homepage", "");
    // Older previews persisted the bundle location as a user homepage. Move
    // only that managed choice to the default branch so app relocation works
    // without overwriting a user's own web, local-file, or blank homepage.
    if (Services.prefs.prefHasUserValue("browser.startup.homepage") &&
        (homepage === "about:newtab" || homepage === newTabURL ||
          (previousNewTabURL && homepage === previousNewTabURL))) {
      Services.prefs.clearUserPref("browser.startup.homepage");
    }
    Services.prefs.getDefaultBranch("").setStringPref("browser.startup.homepage", newTabURL);
    Services.prefs.setStringPref("fluxion.newtab.url", newTabURL);
    Services.prefs.setBoolPref("browser.sessionstore.resume_from_crash", true);
    Services.prefs.setBoolPref("browser.aboutwelcome.enabled", false);
    Services.prefs.setBoolPref("datareporting.policy.dataSubmissionEnabled", false);
    Services.prefs.setBoolPref("datareporting.healthreport.uploadEnabled", false);
    Services.prefs.setBoolPref("toolkit.telemetry.enabled", false);
    Services.prefs.setBoolPref("app.shield.optoutstudies.enabled", false);
    Services.prefs.setBoolPref("browser.newtabpage.activity-stream.showSponsored", false);
    Services.prefs.setBoolPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
    const memoryEnabled = Services.prefs.getBoolPref("fluxion.memory.enabled", false);
    const embeddingsEnabled = memoryEnabled &&
      Services.prefs.getStringPref("fluxion.memory.embeddingProvider", "gecko-local") !== "disabled" &&
      !Services.prefs.getBoolPref("fluxion.memory.nativePendingRemoval", false);
    Services.prefs.setBoolPref("browser.ml.enable", embeddingsEnabled);
    Services.prefs.setBoolPref("places.semanticHistory.featureGate", embeddingsEnabled);
    Services.prefs.setBoolPref("places.semanticHistory.removeOnStartup", !embeddingsEnabled);
    if (embeddingsEnabled) {
      // Install the shared native-write guard once the profile exists, before
      // browser windows can start semantic indexing. Do not construct Places
      // storage during the earlier autoconfig preference-read phase.
      const prepareNativeMemory = () => {
        Services.obs.removeObserver(prepareNativeMemory, "profile-after-change");
        try {
          const { FluxionNativeMemory } = ChromeUtils.importESModule(
            "resource://fluxion/modules/FluxionNativeMemory.sys.mjs"
          );
          FluxionNativeMemory.getManager();
        } catch (error) {
          Services.prefs.setBoolPref("fluxion.memory.nativePendingRemoval", true);
          Services.prefs.setBoolPref("browser.ml.enable", false);
          Services.prefs.setBoolPref("places.semanticHistory.featureGate", false);
          Services.prefs.setBoolPref("places.semanticHistory.removeOnStartup", true);
          Services.prefs.savePrefFile(null);
          Cu.reportError(error);
        }
      };
      Services.obs.addObserver(prepareNativeMemory, "profile-after-change");
    }
    Services.prefs.getDefaultBranch("").setStringPref("browser.toolbars.bookmarks.visibility", "never");
  }

  function load(window, relativePath) {
    const file = root.clone();
    for (const segment of relativePath.split("/")) {
      file.append(segment);
    }
    if (!file.exists() || !file.isFile()) {
      throw new Error(`Fluxion chrome file is missing: ${relativePath}`);
    }
    Services.scriptloader.loadSubScript(
      `resource://fluxion/${relativePath}`,
      window,
      "UTF-8"
    );
  }

  const observer = {
    observe(window, topic) {
      if (
        topic !== "browser-delayed-startup-finished" ||
        !window ||
        !window.document ||
        window.document.documentURI !== "chrome://browser/content/browser.xhtml" ||
        window.__fluxionLoaded
      ) {
        return;
      }

      window.__fluxionLoaded = true;
      try {
        load(window, "chrome/core/url.js");
        load(window, "chrome/core/workspaces.js");
        load(window, "chrome/core/workspace-editor.js");
        load(window, "chrome/core/workspace-tabs.js");
        load(window, "chrome/core/tab-groups.js");
        load(window, "chrome/core/split-views.js");
        load(window, "chrome/core/memory-policy.js");
        load(window, "chrome/core/memory-content.js");
        load(window, "chrome/core/memory-search.js");
        load(window, "chrome/core/memory-context.js");
        load(window, "chrome/core/memory-ranking.js");
        load(window, "chrome/core/memory-grounding.js");
        load(window, "chrome/core/peek.js");
        load(window, "chrome/core/settings.js");
        load(window, "chrome/core/shortcuts.js");
        load(window, "chrome/core/tab-sleeping.js");
        load(window, "chrome/core/tab-selection.js");
        load(window, "chrome/core/tab-close-stability.js");
        load(window, "chrome/core/tab-status.js");
        load(window, "chrome/core/tab-drop.js");
        load(window, "chrome/core/tab-transfer-drag.js");
        load(window, "chrome/core/flow-menu-session.js");
        load(window, "chrome/core/search.js");
        load(window, "chrome/core/flow-navigation.js");
        load(window, "chrome/core/flow-tab-content.js");
        load(window, "chrome/core/index-scheduler.js");
        load(window, "chrome/core/library-data.js");
        load(window, "chrome/core/library-query.js");
        load(window, "chrome/core/library-changes.js");
        load(window, "chrome/core/library-navigation.js");
        load(window, "chrome/core/library-downloads.js");
        load(window, "chrome/core/closed-tabs.js");
        load(window, "chrome/core/data-clearing.js");
        load(window, "chrome/core/theme.js");
        load(window, "chrome/core/permissions.js");
        load(window, "chrome/core/session-recovery.js");
        load(window, "chrome/core/tab-organisation.js");
        load(window, "chrome/core/ai-providers.js");
        load(window, "chrome/fluxion-shortcuts.js");
        load(window, "chrome/fluxion-chrome.js");
        load(window, "chrome/fluxion-flow-performance.js");
        load(window, "chrome/fluxion-web-search.js");
        load(window, "chrome/fluxion-theme.js");
        load(window, "chrome/fluxion-data-clearing.js");
        load(window, "chrome/fluxion-memory.js");
        load(window, "chrome/fluxion-ai.js");
        load(window, "chrome/fluxion-peek.js");
        load(window, "chrome/fluxion-tab-transfer.js");
        load(window, "chrome/fluxion-window-tabs.js");
        load(window, "chrome/fluxion-tab-transfer-verification.js");
        load(window, "chrome/fluxion-tab-sleeping.js");
        load(window, "chrome/fluxion-library.js");
        load(window, "chrome/fluxion-permissions.js");
        load(window, "chrome/fluxion-session-recovery.js");
        try {
          load(window, "chrome/fluxion-settings.js");
          Services.prefs.clearUserPref("fluxion.settings.error");
        } catch (settingsError) {
          Services.prefs.setStringPref("fluxion.settings.error", String(settingsError));
          Services.prefs.savePrefFile(null);
          Cu.reportError(settingsError);
        }
        load(window, "chrome/fluxion-palette.js");
        load(window, "chrome/fluxion-browsing-verification.js");
        load(window, "chrome/fluxion-library-verification.js");
        load(window, "chrome/fluxion-memory-privacy-verification.js");
        load(window, "chrome/fluxion-memory-migration-verification.js");
        load(window, "chrome/fluxion-update-verification.js");
        load(window, "chrome/fluxion-external-open-verification.js");
        load(window, "chrome/fluxion-settings-accessibility-verification.js");
        load(window, "chrome/fluxion-ai-privacy-verification.js");
        load(window, "chrome/fluxion-workspace-verification.js");
        load(window, "chrome/fluxion-default-bookmarks-verification.js");
        load(window, "chrome/fluxion-file-picker-verification.js");
        load(window, "chrome/fluxion-shortcut-verification.js");
        if (newTabURL !== "about:newtab") {
          const { AboutNewTab } = ChromeUtils.importESModule(
            "resource:///modules/AboutNewTab.sys.mjs"
          );
          AboutNewTab.newTabURL = newTabURL;
          // A restoring browser can still report about:blank here. Override
          // future new tabs only; never navigate SessionStore's selected tab.
        }
        Services.prefs.clearUserPref("fluxion.startup.error");
      } catch (error) {
        window.__fluxionLoaded = false;
        Services.prefs.setStringPref("fluxion.startup.error", String(error));
        Services.prefs.savePrefFile(null);
        Cu.reportError(error);
      }
    },
  };

  Services.obs.addObserver(observer, "browser-delayed-startup-finished");
})();
