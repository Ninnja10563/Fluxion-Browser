name: macOS preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 0.70.1-preview.1
      tag:
        description: Git tag for the release
        required: true
        default: v0.70.1-preview.1
      publish:
        description: Publish assets to GitHub Releases after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    name: Build universal Fluxion DMG
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check product code and regression tests
        shell: bash
        run: ./fluxion/scripts/check.sh

      - name: Download official Firefox Gecko runtime
        shell: bash
        run: |
          set -euo pipefail
          node ./fluxion/scripts/download-gecko.mjs "$RUNNER_TEMP/firefox.dmg"
          mkdir -p "$RUNNER_TEMP/firefox-volume" "$RUNNER_TEMP/firefox-source"
          hdiutil attach "$RUNNER_TEMP/firefox.dmg" \
            -mountpoint "$RUNNER_TEMP/firefox-volume" \
            -nobrowse -readonly
          ditto "$RUNNER_TEMP/firefox-volume/Firefox.app" \
            "$RUNNER_TEMP/firefox-source/Firefox.app"
          hdiutil detach "$RUNNER_TEMP/firefox-volume"
          codesign --verify --deep --strict "$RUNNER_TEMP/firefox-source/Firefox.app"
          locked_version="$(node -p "require('./fluxion/runtime/gecko-lock.json').version")"
          source_version="$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/firefox-source/Firefox.app/Contents/Info.plist")"
          [[ "$source_version" == "$locked_version" ]]

      - name: Build Fluxion application
        id: build
        shell: bash
        env:
          FLUXION_FIREFOX_BIN: ${{ runner.temp }}/firefox-source/Firefox.app/Contents/MacOS/firefox
          FLUXION_TARGET_ARCH: universal2
          FLUXION_SKIP_LAUNCH_CHECK: "1"
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          export FLUXION_APP_VERSION="${RELEASE_VERSION%%-*}"
          ./fluxion/scripts/build-macos.sh --clean

      - name: Verify native signed-update policy
        shell: bash
        run: |
          set -euo pipefail
          frameworks="$GITHUB_WORKSPACE/.runtime/Fluxion.app/Contents/Frameworks"
          xcrun clang -mmacosx-version-min=12.0 -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter -Werror \
            -F "$frameworks" -framework AppKit -framework Sparkle -Wl,-rpath,"$frameworks" \
            fluxion/packaging/macos/updater/BridgePolicyTests.m -o "$RUNNER_TEMP/fluxion-updater-policy"
          "$RUNNER_TEMP/fluxion-updater-policy"
          for binary in "$frameworks/libFluxionUpdater.dylib" "$frameworks/Sparkle.framework/Sparkle"; do
            architectures="$(lipo -archs "$binary")"
            [[ " $architectures " == *' arm64 '* && " $architectures " == *' x86_64 '* ]]
          done
          ! strings "$frameworks/libFluxionUpdater.dylib" | grep -F '127.0.0.1:38473'

      - name: Verify complete native browser integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          FLUXION_CAPTURE_PATH: ${{ runner.temp }}/fluxion-chrome.png
        run: ./fluxion/scripts/verify-macos-app.sh '.runtime/Fluxion.app'

      - name: Verify application architecture and signature
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          launcher='.runtime/Fluxion.app/Contents/MacOS/Fluxion'
          info='.runtime/Fluxion.app/Contents/Info.plist'
          resources='.runtime/Fluxion.app/Contents/Resources'
          architectures="$(lipo -archs "$launcher")"
          [[ " $architectures " == *' arm64 '* ]]
          [[ " $architectures " == *' x86_64 '* ]]
          [[ "$(plutil -extract CFBundleIconFile raw "$info")" == 'fluxion.icns' ]]
          ! plutil -extract CFBundleIconName raw "$info" >/dev/null 2>&1
          [[ "$(plutil -extract CFBundleName raw "$info")" == 'Fluxion' ]]
          app_version="$(plutil -extract CFBundleShortVersionString raw "$info")"
          grep -q "const PRODUCT_VERSION = \"${app_version}\";" \
            "$resources/fluxion/chrome/fluxion-settings.js"
          [[ ! -e "$resources/Assets.car" ]]
          for icon in firefox.icns document.icns fileBookmark.icns; do
            cmp "$resources/fluxion.icns" "$resources/$icon"
          done
          cmp 'fluxion/assets/app-icons/app-icon-1024.png' "$resources/fluxion/assets/app-icons/app-icon-1024.png"
          iconset="$RUNNER_TEMP/fluxion-supplied-artwork.iconset"
          iconutil -c iconset "$resources/fluxion.icns" -o "$iconset"
          [[ "$(sips -g pixelWidth "$iconset/icon_512x512@2x.png" | awk '$1 == "pixelWidth:" {print $2}')" == 1024 ]]
          [[ "$(sips -g pixelHeight "$iconset/icon_512x512@2x.png" | awk '$1 == "pixelHeight:" {print $2}')" == 1024 ]]
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); assert "org.mozilla.updater" not in p.get("SMPrivilegedExecutables",{})' "$info"
          cmp "$resources/fluxion.icns" "$resources/firefox.icns"
          codesign --verify --deep --strict '.runtime/Fluxion.app'
          locked_version="$(node -p "require('./fluxion/runtime/gecko-lock.json').version")"
          [[ "$(plutil -extract upstreamVersion raw "$resources/fluxion/runtime-provenance.json")" == "$locked_version" ]]
          [[ "$(plutil -extract policies.DisableAppUpdate raw "$resources/distribution/policies.json")" == 'true' ]]

      - name: Verify native migration wizard and HTML bookmark import
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_MIGRATION_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-migration-evidence
        run: bash ./fluxion/scripts/verify-macos-migration.sh '.runtime/Fluxion.app'

      - name: Preserve native migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-migration-evidence
          path: ${{ runner.temp }}/fluxion-migration-evidence
          if-no-files-found: warn

      - name: Verify native Fluxion branding and preserved security status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_BRANDING_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-branding-evidence
        run: bash ./fluxion/scripts/verify-macos-branding.sh '.runtime/Fluxion.app'

      - name: Preserve native branding evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-branding-evidence
          path: ${{ runner.temp }}/fluxion-branding-evidence
          if-no-files-found: warn

      - name: Verify product service policy and address bar geometry
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_PRODUCT_CHROME_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-product-chrome-evidence
        run: ./fluxion/scripts/verify-macos-product-chrome.sh '.runtime/Fluxion.app'

      - name: Preserve product chrome evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-product-chrome-evidence
          path: ${{ runner.temp }}/fluxion-product-chrome-evidence
          if-no-files-found: warn

      - name: Verify native sidebar workspace gestures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_WORKSPACE_GESTURE_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-workspace-gesture-evidence
        run: ./fluxion/scripts/verify-macos-workspace-gestures.sh '.runtime/Fluxion.app'

      - name: Preserve workspace gesture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-workspace-gesture-evidence
          path: ${{ runner.temp }}/fluxion-workspace-gesture-evidence
          if-no-files-found: warn

      - name: Verify repeated native Flow updates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-flow.sh '.runtime/Fluxion.app'

      - name: Verify stable Flow selection in large sessions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-selection-evidence
        run: ./fluxion/scripts/verify-macos-selection.sh '.runtime/Fluxion.app'

      - name: Check keyed Flow structural changes in large sessions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_STRUCTURE_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-structure-evidence
        run: ./fluxion/scripts/verify-macos-structure.sh '.runtime/Fluxion.app'

      - name: Verify native keyboard closure and browser frame geometry
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_FRAME_TEST: "1"
          FLUXION_FRAME_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-frame-evidence
        run: ./fluxion/scripts/verify-macos-frame.sh '.runtime/Fluxion.app'

      - name: Preserve browser frame and real webpage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-frame-evidence
          path: ${{ runner.temp }}/fluxion-frame-evidence
          if-no-files-found: warn

      - name: Verify custom chrome colors and clean relaunch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_COLORS_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-colors-evidence
        run: ./fluxion/scripts/verify-macos-colors.sh '.runtime/Fluxion.app'

      - name: Preserve custom color evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-colors-evidence
          path: ${{ runner.temp }}/fluxion-colors-evidence
          if-no-files-found: warn

      - name: Preserve Flow structure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-structure-evidence
          path: ${{ runner.temp }}/fluxion-structure-evidence
          if-no-files-found: warn

      - name: Preserve Flow selection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-selection-evidence
          path: ${{ runner.temp }}/fluxion-selection-evidence
          if-no-files-found: warn

      - name: Verify native sidebar resizing and saved width
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SIDEBAR_WIDTH_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-sidebar-width-evidence
        run: ./fluxion/scripts/verify-macos-sidebar-width.sh '.runtime/Fluxion.app'

      - name: Preserve sidebar sizing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-sidebar-width-evidence
          path: ${{ runner.temp }}/fluxion-sidebar-width-evidence
          if-no-files-found: warn

      - name: Verify packaged Settings shortcut capture and cross-window saves
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SHORTCUT_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-shortcut-evidence
        run: ./fluxion/scripts/verify-macos-shortcuts.sh '.runtime/Fluxion.app'

      - name: Preserve shortcut capture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-shortcut-evidence
          path: ${{ runner.temp }}/fluxion-shortcut-evidence
          if-no-files-found: warn

      - name: Verify fresh-profile defaults and existing bookmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-default-bookmarks.sh '.runtime/Fluxion.app'

      - name: Verify real transfers and content form navigation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-browsing.sh '.runtime/Fluxion.app'

      - name: Verify real macOS file picker cancellation and upload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_FILE_PICKER_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-file-picker-evidence
        run: ./fluxion/scripts/verify-macos-file-picker.sh '.runtime/Fluxion.app'

      - name: Preserve native file picker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-file-picker-evidence
          path: ${{ runner.temp }}/fluxion-file-picker-evidence
          if-no-files-found: warn

      - name: Verify full Library search and pagination
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          FLUXION_LIBRARY_SCREENSHOT: ${{ runner.temp }}/fluxion-library.png
          FLUXION_LIBRARY_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-library-evidence
        run: ./fluxion/scripts/verify-macos-library.sh '.runtime/Fluxion.app'

      - name: Preserve Library verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-library-evidence
          path: ${{ runner.temp }}/fluxion-library-evidence
          if-no-files-found: warn

      - name: Verify real local semantic retrieval
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-memory.sh '.runtime/Fluxion.app'

      - name: Verify workspace restoration and cross-window editing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-workspaces.sh '.runtime/Fluxion.app'

      - name: Verify native cross-window tab transfer and privacy boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_TAB_TRANSFER_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-tab-transfer-evidence
        run: ./fluxion/scripts/verify-macos-tab-transfer.sh '.runtime/Fluxion.app'

      - name: Preserve native tab transfer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-tab-transfer-evidence
          path: ${{ runner.temp }}/fluxion-tab-transfer-evidence
          if-no-files-found: warn

      - name: Verify session recovery and private isolation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-session.sh '.runtime/Fluxion.app'

      - name: Verify macOS last-window close, reopen, and relaunch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_LAST_WINDOW_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-last-window-evidence
        run: ./fluxion/scripts/verify-macos-last-window.sh '.runtime/Fluxion.app'

      - name: Preserve native last-window evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-last-window-evidence
          path: ${{ runner.temp }}/fluxion-last-window-evidence
          if-no-files-found: warn

      - name: Verify native Memory deletion across windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-memory-privacy.sh '.runtime/Fluxion.app'

      - name: Verify disabled startup removes legacy sensitive Memory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-memory-policy.sh '.runtime/Fluxion.app'

      - name: Preserve chrome inspection snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-chrome-inspection
          path: ${{ runner.temp }}/fluxion-chrome.png
          if-no-files-found: warn

      - name: Verify corrupt Memory policy preserves native evidence on restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_MEMORY_CORRUPTION_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-memory-corruption-evidence
        run: ./fluxion/scripts/verify-macos-memory-corruption.sh '.runtime/Fluxion.app'

      - name: Preserve Memory corruption evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-memory-corruption
          path: ${{ runner.temp }}/fluxion-memory-corruption-evidence
          if-no-files-found: warn

      - name: Verify explicit Fluxion update discovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FLUXION_UPDATES_SCREENSHOT: ${{ runner.temp }}/fluxion-updates.png
        run: ./fluxion/scripts/verify-macos-updates.sh '.runtime/Fluxion.app'

      - name: Verify native macOS external URL and file delivery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-external-open.sh '.runtime/Fluxion.app'

      - name: Verify native Settings accessible names and descriptions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          FLUXION_SETTINGS_ACCESSIBILITY_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-settings-layout-evidence
        run: ./fluxion/scripts/verify-macos-settings-accessibility.sh '.runtime/Fluxion.app'

      - name: Preserve Settings layout and accessibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-settings-layout-evidence
          path: ${{ runner.temp }}/fluxion-settings-layout-evidence
          if-no-files-found: warn

      - name: Verify native AI credential isolation and sharing revocation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-ai-privacy.sh '.runtime/Fluxion.app'

      - name: Preserve update inspection snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-updates-inspection
          path: ${{ runner.temp }}/fluxion-updates.png
          if-no-files-found: warn

      - name: Preserve Library inspection snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-library-inspection
          path: ${{ runner.temp }}/fluxion-library.png
          if-no-files-found: warn

      - name: Verify real signed replacement, canceled quit, and session-preserving relaunch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_NATIVE_UPDATER_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-native-updater-evidence
        run: bash ./fluxion/scripts/verify-macos-native-updater.sh '.runtime/Fluxion.app'

      - name: Preserve native installer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-native-updater-evidence
          path: ${{ runner.temp }}/fluxion-native-updater-evidence
          if-no-files-found: warn

      - name: Package DMG and checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./fluxion/scripts/package-macos-dmg.sh \
            --version "$RELEASE_VERSION" \
            --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Preserve packaged assets
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-${{ inputs.version }}-macOS-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          gh release create "$RELEASE_TAG" \
            "dist/Fluxion-${RELEASE_VERSION}-macOS-universal.dmg" \
            "dist/Fluxion-${RELEASE_VERSION}-macOS-universal.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Fluxion ${RELEASE_VERSION} — Gecko Foundation Preview" \
            --notes-file fluxion/release/preview-notes.md \
            --prerelease
