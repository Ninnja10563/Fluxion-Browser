name: macOS integration diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Check native macOS integration without publishing
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check product code and regressions
        run: ./fluxion/scripts/check.sh

      - name: Download and verify the locked Gecko runtime
        shell: bash
        run: |
          set -euo pipefail
          node ./fluxion/scripts/download-gecko.mjs "$RUNNER_TEMP/firefox.dmg"
          mkdir -p "$RUNNER_TEMP/firefox-volume" "$RUNNER_TEMP/firefox-source"
          hdiutil attach "$RUNNER_TEMP/firefox.dmg" \
            -mountpoint "$RUNNER_TEMP/firefox-volume" -nobrowse -readonly
          ditto "$RUNNER_TEMP/firefox-volume/Firefox.app" \
            "$RUNNER_TEMP/firefox-source/Firefox.app"
          hdiutil detach "$RUNNER_TEMP/firefox-volume"
          codesign --verify --deep --strict "$RUNNER_TEMP/firefox-source/Firefox.app"

      - name: Build diagnostic Fluxion application
        id: build
        env:
          FLUXION_FIREFOX_BIN: ${{ runner.temp }}/firefox-source/Firefox.app/Contents/MacOS/firefox
          FLUXION_TARGET_ARCH: universal2
          FLUXION_SKIP_LAUNCH_CHECK: "1"
        run: ./fluxion/scripts/build-macos.sh --clean

      - name: Check native Settings accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SETTINGS_ACCESSIBILITY_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-settings-layout-evidence
        run: ./fluxion/scripts/verify-macos-settings-accessibility.sh '.runtime/Fluxion.app'

      - name: Preserve Settings layout and accessibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-settings-layout-diagnostic
          path: ${{ runner.temp }}/fluxion-settings-layout-evidence
          if-no-files-found: warn

      - name: Check Flow updates and thousand-tab search responsiveness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-flow.sh '.runtime/Fluxion.app'

      - name: Check native sidebar resizing and saved width
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SIDEBAR_WIDTH_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-sidebar-width-evidence
        run: ./fluxion/scripts/verify-macos-sidebar-width.sh '.runtime/Fluxion.app'

      - name: Check stable Flow selection in large sessions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-selection-evidence
        run: ./fluxion/scripts/verify-macos-selection.sh '.runtime/Fluxion.app'

      - name: Check keyed Flow structural changes in large sessions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_STRUCTURE_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-structure-evidence
        run: ./fluxion/scripts/verify-macos-structure.sh '.runtime/Fluxion.app'

      - name: Preserve Flow structure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-structure-evidence
          path: ${{ runner.temp }}/fluxion-structure-evidence
          if-no-files-found: warn

      - name: Preserve Flow selection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-selection-diagnostic
          path: ${{ runner.temp }}/fluxion-selection-evidence
          if-no-files-found: warn

      - name: Preserve sidebar sizing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-sidebar-width-diagnostic
          path: ${{ runner.temp }}/fluxion-sidebar-width-evidence
          if-no-files-found: warn

      - name: Check packaged Settings shortcut capture and cross-window saves
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-shortcuts.sh '.runtime/Fluxion.app'

      - name: Check fresh-profile defaults and existing bookmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-default-bookmarks.sh '.runtime/Fluxion.app'

      - name: Check native external link and file delivery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-external-open.sh '.runtime/Fluxion.app'

      - name: Check native AI privacy boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-ai-privacy.sh '.runtime/Fluxion.app'

      - name: Check real transfers and native website authentication
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-browsing.sh '.runtime/Fluxion.app'

      - name: Check real macOS file picker cancellation and upload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_FILE_PICKER_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-file-picker-evidence
        run: ./fluxion/scripts/verify-macos-file-picker.sh '.runtime/Fluxion.app'

      - name: Preserve native file picker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-file-picker-diagnostic
          path: ${{ runner.temp }}/fluxion-file-picker-evidence
          if-no-files-found: warn

      - name: Check native Library keyboard and item menus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_LIBRARY_SCREENSHOT: ${{ runner.temp }}/fluxion-library.png
          FLUXION_LIBRARY_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-library-evidence
        run: ./fluxion/scripts/verify-macos-library.sh '.runtime/Fluxion.app'

      - name: Preserve Library verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-Library-evidence-diagnostic
          path: ${{ runner.temp }}/fluxion-library-evidence
          if-no-files-found: warn

      - name: Check workspace restoration and cross-window editing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-workspaces.sh '.runtime/Fluxion.app'

      - name: Check native cross-window tab transfer and privacy boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_TAB_TRANSFER_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-tab-transfer-evidence
        run: ./fluxion/scripts/verify-macos-tab-transfer.sh '.runtime/Fluxion.app'

      - name: Preserve native tab transfer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-tab-transfer-diagnostic
          path: ${{ runner.temp }}/fluxion-tab-transfer-evidence
          if-no-files-found: warn

      - name: Check exact and real semantic Memory retrieval
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-memory.sh '.runtime/Fluxion.app'

      - name: Check native Memory privacy cleanup and sensitive URLs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-memory-privacy.sh '.runtime/Fluxion.app'

      - name: Check disabled startup removes legacy sensitive Memory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./fluxion/scripts/verify-macos-memory-policy.sh '.runtime/Fluxion.app'

      - name: Check adopted tabs after real restart and crash recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./fluxion/scripts/verify-macos-session.sh '.runtime/Fluxion.app'

      - name: Check corrupt Memory policy preserves native evidence on restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLUXION_MEMORY_CORRUPTION_ARTIFACT_DIR: ${{ runner.temp }}/fluxion-memory-corruption-evidence
        run: ./fluxion/scripts/verify-macos-memory-corruption.sh '.runtime/Fluxion.app'

      - name: Preserve Memory corruption evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-memory-corruption-evidence
          path: ${{ runner.temp }}/fluxion-memory-corruption-evidence
          if-no-files-found: warn

      - name: Preserve Library diagnostic snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Fluxion-Library-diagnostic
          path: ${{ runner.temp }}/fluxion-library.png
          if-no-files-found: warn
